<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <div class="flex min-h-screen flex-nowrap">

        <!-- Side bar -->

        <div class="w-64 bg-gray-800 hidden md:block">
            <!-- Dashbaord Text Wrapper -->
            <div class="flex justify-center items-center h-20 bg-gray-950">
                <h1 class="text-white text-2xl">Dashboard</h1>
            </div>

            <nav class="mt-10">
                <a href="" class="flex  items-center py-2 px-6 bg-gray-700 text-gray-100 mt-4 hover:text-gray-400">
                    <span class="mx-3">Home</span>
                </a>
                <a href=""
                    class="flex  items-center py-2 px-6 hover:bg-gray-700 text-gray-100 mt-4 hover:text-gray-400">
                    <span class="mx-3">Analytics</span>
                </a>
                <a href=""
                    class="flex  items-center py-2 px-6 hover:bg-gray-700 text-gray-100 mt-4 hover:text-gray-400">
                    <span class="mx-3">Sales</span>
                </a>
                <a href=""
                    class="flex  items-center py-2 px-6 hover:bg-gray-700 text-gray-100 mt-4 hover:text-gray-400">
                    <span class="mx-3">Messages</span>
                </a>
            </nav>
        </div>


        <!-- Main-Content -->

        <div>
            <!-- nav bar -->
            <header>
                <button class="px-4 py-2 border rounded-md border-gray-600 text-orange-600">
                    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 18H10" stroke="#000000" stroke-width="2" stroke-linecap="round" />
                        <path d="M4 12L16 12" stroke="#000000" stroke-width="2" stroke-linecap="round" />
                        <path d="M4 6L20 6" stroke="#000000" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>

                <div>
                    <button>

                    </button>
                </div>

            </header>
        </div>

    </div>



</body>

</html>
